name: Plugin build

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      duetwebcontrol_ref:
        description: 'Enter the tag, branch or SHA of the Duet3D/DuetWebControl repository to use.'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
      with:
          path: plugin

    - name: Checkout DuetWebControl repository
      uses: actions/checkout@v4
      with:
        repository: Duet3D/DuetWebControl
        ref: ${{ github.event.inputs.duetwebcontrol_ref }}
        path: DuetWebControl
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest

    - name: Install dependencies in DuetWebControl
      working-directory: DuetWebControl
      run: npm install

    - name: Build plugin
      working-directory: DuetWebControl
      run: npm run build-plugin ../plugin/src

    - name: Rename plugin zip file
      id: rename-zip
      working-directory: DuetWebControl
      run: |
          zipfile=$(ls dist/ExecOnMcode-*.zip)
          base=$(basename "$zipfile" .zip)
          newname="${base}-${{ github.event.inputs.duetwebcontrol_ref }}.zip"
          mv "$zipfile" "$newname"
          echo "zipname=$(basename $newname .zip)" >> "$GITHUB_OUTPUT"

    - name: Upload plugin archive
      uses: actions/upload-artifact@v4
      with:
        name: ExecOnMcode_toUnzip
        path: DuetWebControl/${{ steps.rename-zip.outputs.zipname }}.zip
